<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="keywords" content="Felixent-Edu">
    <meta name="description" content="The plagiarism checker that uses Tailwind UI for the frontend and integrates the Google Search API for content comparison">
    <meta name="author" content="Mosquito">
    <link href="favicon.ico" rel="icon">
  <title>Plagiarism Checker</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="max-w-2xl w-full bg-white shadow-lg rounded-lg p-8">
    <h1 class="text-3xl font-bold text-center text-blue-700 mb-6">Plagiarism Checker</h1>
    
    <!-- Input Section -->
    <textarea id="inputText" 
      class="w-full h-40 p-4 border rounded-lg focus:ring focus:ring-blue-300"
      placeholder="Paste your text here..."></textarea>
    
    <!-- Action Button -->
    <button onclick="checkPlagiarism()" 
      class="mt-4 w-full px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
      Check Plagiarism
    </button>
    
    <!-- Results Section -->
    <div id="results" class="mt-6 space-y-4"></div>
  </div>

    <footer class="text-center p-8 text-gray-600 bg-gray-200">
      <p>Guide for Educational Purposes</p>
      <p class_="text-xs mt-2">&copy; 2025 Felixent. All rights reserved.</p>
    </footer>

  <script>
    async function checkPlagiarism() {
      const text = document.getElementById("inputText").value.trim();
      if (!text) {
        document.getElementById("results").innerHTML = 
          '<p class="text-red-600">Please enter some text to check.</p>';
        return;
      }

      // Take a sample chunk of text for search
      const query = text.split(" ").slice(0, 10).join(" ");

      try {
        const response = await fetch(
          `https://www.googleapis.com/customsearch/v1?q=${encodeURIComponent(query)}&key=YOUR_API_KEY&cx=YOUR_CX`
        );
        const data = await response.json();

        if (!data.items) {
          document.getElementById("results").innerHTML = 
            '<p class="text-gray-600">No matches found.</p>';
          return;
        }

        let resultsHTML = "";
        data.items.forEach(item => {
          resultsHTML += `
            <div class="border p-4 rounded-lg shadow-sm">
              <a href="${item.link}" target="_blank" class="text-blue-600 font-semibold hover:underline">${item.title}</a>
              <p class="text-gray-700 mt-2">${item.snippet}</p>
            </div>
          `;
        });

        document.getElementById("results").innerHTML = resultsHTML;
      } catch (error) {
        document.getElementById("results").innerHTML = 
          '<p class="text-red-600">Error fetching results. Check your API key and CX.</p>';
      }
    }
  </script>
</body>
</html>
